<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Animated Logo Preview | Identity Aesthetics</title>
  <style>
    :root{color-scheme:dark;--navy:#142a46;--navy-deep:#0b1727;--gold:#e7a92d;--cream:#f7f1e7}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:32px 18px;background:radial-gradient(circle at 50% 34%,#29496f 0,var(--navy) 42%,var(--navy-deep) 100%);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
    main{width:min(980px,100%);text-align:center}
    .eyebrow{margin:0 0 8px;color:#f2c66d;font:600 12px/1.4 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(26px,4vw,44px);font-weight:400;letter-spacing:.035em}
    .note{max-width:660px;margin:12px auto 24px;color:#ded6ca;font:400 15px/1.6 Arial,sans-serif}
    .stage{position:relative;width:min(760px,92vw);aspect-ratio:3/2;margin:auto;display:grid;place-items:center;border:1px solid rgba(232,180,73,.35);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 34px 90px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08);overflow:hidden}
    .logo-stack{position:relative;width:94%;aspect-ratio:3/2}
    .logo-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    .sparkles{pointer-events:none}
    .status{display:inline-flex;align-items:center;gap:8px;margin-top:20px;color:#d9cfc1;font:500 13px/1.4 Arial,sans-serif}
    .status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
    @media(max-width:560px){body{padding:22px 12px}.stage{border-radius:20px}.note{font-size:14px}.logo-stack{width:98%}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Approval Preview</p>
    <h1>Identity Aesthetics Animated Logo</h1>
    <p class="note">The corrected transparent logo remains unchanged. Two separate sparkle accents twinkle gently in alternating sequence.</p>
    <section class="stage" aria-label="Animated Identity Aesthetics logo preview">
      <div class="logo-stack">
        <img src="images/identity-aesthetics-logo-best-slim-gold.png" alt="Identity Aesthetics">
        <img class="sparkles" src="images/identity-aesthetics-sparkles.svg?v=98" alt="">
      </div>
    </section>
    <p class="status">Approved logo — now used throughout the website</p>
  </main>
</body>
</html>
