<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-label="Animated sparkle accents">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.28" stop-color="#fff8e7" stop-opacity="0.96"/>
      <stop offset="0.62" stop-color="#f5b54a" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#f5b54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b54a" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff3cf" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#fff3cf" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#f5b54a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b54a" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff3cf" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#fff3cf" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#f5b54a" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .twinkle { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .twinkle-one { animation: iaTwinkleOne 4.8s linear infinite; }
      .twinkle-two { animation: iaTwinkleTwo 4.8s linear infinite; }
      @keyframes iaTwinkleOne {
        0%, 11%, 34%, 100% { opacity: 0; transform: scale(.24); }
        18% { opacity: 1; transform: scale(1.18); }
        25% { opacity: .72; transform: scale(.9); }
      }
      @keyframes iaTwinkleTwo {
        0%, 49%, 72%, 100% { opacity: 0; transform: scale(.24); }
        56% { opacity: 1; transform: scale(1.2); }
        63% { opacity: .72; transform: scale(.9); }
      }
      @media (prefers-reduced-motion: reduce) { .twinkle { display: none; } }
    </style>
  </defs>

  <g transform="translate(580 312)">
    <g class="twinkle twinkle-one" filter="url(#softGlow)">
      <ellipse cx="0" cy="0" rx="78" ry="4.4" fill="url(#rayH)"/>
      <ellipse cx="0" cy="0" rx="4.4" ry="58" fill="url(#rayV)"/>
      <path d="M-27-27 L-4-7 L0 0 L-7-4 Z M27-27 L7-4 L0 0 L4-7 Z M27 27 L4 7 L0 0 L7 4 Z M-27 27 L-7 4 L0 0 L-4 7 Z" fill="#fff8e7" opacity=".88"/>
      <circle cx="0" cy="0" r="18" fill="url(#glow)"/>
    </g>
  </g>

  <g transform="translate(1007 768)">
    <g class="twinkle twinkle-two" filter="url(#softGlow)">
      <ellipse cx="0" cy="0" rx="53" ry="3.8" fill="url(#rayH)"/>
      <ellipse cx="0" cy="0" rx="3.8" ry="43" fill="url(#rayV)"/>
      <path d="M-19-19 L-3-6 L0 0 L-6-3 Z M19-19 L6-3 L0 0 L3-6 Z M19 19 L3 6 L0 0 L6 3 Z M-19 19 L-6 3 L0 0 L-3 6 Z" fill="#fff8e7" opacity=".9"/>
      <circle cx="0" cy="0" r="14" fill="url(#glow)"/>
    </g>
  </g>
</svg>
